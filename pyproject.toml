[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "automl-nas-prototype"
version = "0.2.0"
description = "A reproducible local multi-trial neural architecture search prototype"
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Amanatullah Pandu Zenklinov" }]
dependencies = [
  "numpy==1.26.4",
  "optuna==4.0.0",
  "PyYAML==6.0.2",
  "ray[tune]==2.40.0",
  "torch==2.4.0",
  "torchvision==0.19.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
automl-nas = "automl_nas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "smoke: end-to-end local Ray smoke tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
