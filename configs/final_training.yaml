# Frozen final-training stage. Trains strategy winners and the fixed reference baseline.
seed: 4242
data:
  dataset: cifar10
  directory: ../data
  validation_fraction: 0.10
  split_seed: 2026
  stratified: true
  num_workers: 0
  max_train_samples: null
  max_validation_samples: null
  synthetic_samples: null
  normalization:
    mean: [0.49151359443082787, 0.48231470971200985, 0.44681383799700436]
    std: [0.24705092701492043, 0.24347971893365994, 0.2615095063426509]
    provenance: "Frozen from only the seed-2026 stratified 45,000-example training split."
  augmentation: {random_crop_padding: 4, horizontal_flip_probability: 0.5}
model:
  input_channels: 3
  num_classes: 10
  search_space:
    num_blocks: {min: 2, max: 4}
    kernel_sizes: [3, 5]
    output_channels: [16, 32, 64]
    activations: [relu, silu]
    residual: [true, false]
training:
  batch_size: 64
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0001
  lr_scheduler: none
  evaluation_interval_epochs: 1
  max_epochs: 20
  deterministic_algorithms: true
search:
  strategy: random
  seed: 2026
  num_trials: 20
  metric: validation_accuracy
  mode: max
  time_attr: training_iteration
  max_t: 20
  grace_period_epochs: 4
  reduction_factor: 2
  max_concurrent_trials: 1
  tpe: {n_startup_trials: 10, n_ei_candidates: 24, multivariate: false, constant_liar: false}
resources: {cpu_per_trial: 1, gpu_per_trial: 1}
protocol:
  candidate_search_seeds: [2026, 2027, 2028]
  search_training_seed: 4242
  confirmation_seeds: [3101, 3102, 3103]
  final_training_seeds: [4101, 4102, 4103, 4104, 4105]
  final_budget_locked: true
output: {root_directory: ../artifacts, run_label: final-training}
