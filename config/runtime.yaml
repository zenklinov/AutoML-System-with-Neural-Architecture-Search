# Runtime & Orchestration Configuration

# Orchestrator Settings
orchestrator:
  scheduler: "asha" # Async HyperBand
  search_algo: "optuna" # Bayesian Optimization (TPE)
  metric: "accuracy"
  mode: "max"
  max_concurrent_trials: 4
  grace_period_epochs: 2

# Compute Resource Allocation
resources:
  cpu_per_trial: 2
  gpu_per_trial: 0.5 # Fractional GPU for efficiency
  max_failures: 3 # Retry failed trials (Spot instance support)

# Storage & Checkpointing
storage:
  type: "local" # options: [s3, minio, local]
  path: "./ray_results"
  checkpoint_freq: 1 # Epochs

# Global Constraints
budget:
  max_trials: 50
  max_time_hours: 2.0
